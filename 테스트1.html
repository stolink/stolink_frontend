<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Arc Diagram Fixed</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background-color: #1a1a1a;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        height: 100vh;
      }
      h2 {
        margin-top: 20px;
        font-weight: 600;
        color: #ffffff;
      }
      .controls {
        margin: 20px;
        background: #333;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid #444;
      }
      button {
        background: #444;
        color: #fff;
        border: 1px solid #555;
        padding: 8px 16px;
        margin: 0 5px;
        cursor: pointer;
        border-radius: 4px;
        transition: 0.2s;
      }
      button:hover,
      button.active {
        background: #007acc;
        border-color: #007acc;
      }

      #chart {
        /* 차트 영역 확인을 위해 배경색 살짝 추가 */
        background-color: #222;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }

      /* 텍스트 가독성 개선 */
      .node text {
        font-size: 13px;
        fill: #eee;
        text-anchor: middle;
        font-weight: 500;
        pointer-events: none;
        text-shadow: 1px 1px 2px #000;
      }

      /* 노드 호버 효과 */
      .node circle {
        stroke: #1a1a1a;
        stroke-width: 2px;
        cursor: pointer;
      }
      .node:hover circle {
        stroke: #fff;
        stroke-width: 3px;
      }

      .link {
        fill: none;
        stroke-opacity: 0.5;
        mix-blend-mode: screen;
        transition: stroke-opacity 0.2s;
      }
      .link:hover {
        stroke-opacity: 1;
        stroke-width: 5px !important;
      }

      #tooltip {
        position: absolute;
        visibility: hidden;
        background: rgba(0, 0, 0, 0.9);
        padding: 10px;
        border-radius: 4px;
        font-size: 12px;
        border: 1px solid #555;
        pointer-events: none;
        z-index: 100;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h2>Character Relationship Arc Diagram</h2>

    <div class="controls">
      <span>정렬 기준: </span>
      <button onclick="updateLayout('id')" class="active" id="btn-id">
        등장 순서
      </button>
      <button onclick="updateLayout('group')" id="btn-group">세력별</button>
      <button onclick="updateLayout('rank')" id="btn-rank">서열순</button>
    </div>

    <svg id="chart" width="1000" height="600"></svg>
    <div id="tooltip"></div>

    <script>
      // === 1. 데이터 정의 ===
      const data = {
        nodes: [
          { id: "주인공", group: "A", rank: 10 },
          { id: "파트너", group: "A", rank: 8 },
          { id: "조력자1", group: "A", rank: 5 },
          { id: "조력자2", group: "A", rank: 4 },
          { id: "배신자", group: "A", rank: 6 },
          { id: "라이벌", group: "B", rank: 9 },
          { id: "적군대장", group: "B", rank: 10 },
          { id: "적군참모", group: "B", rank: 7 },
          { id: "중립상인", group: "C", rank: 3 },
          { id: "정보상", group: "C", rank: 5 },
        ],
        links: [
          { source: "주인공", target: "파트너", value: 5, type: 1 },
          { source: "주인공", target: "조력자1", value: 3, type: 1 },
          { source: "주인공", target: "라이벌", value: 4, type: -1 },
          { source: "주인공", target: "적군대장", value: 5, type: -1 },
          { source: "파트너", target: "조력자2", value: 2, type: 1 },
          { source: "배신자", target: "주인공", value: 2, type: 1 },
          { source: "배신자", target: "적군참모", value: 4, type: -1 },
          { source: "라이벌", target: "적군대장", value: 3, type: -1 },
          { source: "중립상인", target: "주인공", value: 1, type: 1 },
          { source: "중립상인", target: "적군대장", value: 1, type: 1 },
          { source: "정보상", target: "배신자", value: 3, type: -1 },
        ],
      };

      // === 2. 차트 초기화 ===
      const svg = d3.select("#chart");
      const margin = { top: 250, right: 80, bottom: 200, left: 80 };
      const width = +svg.attr("width") - margin.left - margin.right;
      const height = +svg.attr("height") - margin.top - margin.bottom;

      // 그룹 컨테이너 생성 (좌표계 중심 이동)
      const g = svg
        .append("g")
        .attr("transform", `translate(${margin.left}, ${margin.top})`);

      // 레이어 순서 중요: 선이 뒤로 가고, 노드가 앞으로 오도록 순서 지정
      const linkLayer = g.append("g").attr("class", "links");
      const nodeLayer = g.append("g").attr("class", "nodes");

      // 스케일 및 컬러 정의
      const x = d3.scalePoint().range([0, width]).padding(0.6);
      const colorGroup = d3
        .scaleOrdinal(d3.schemeCategory10)
        .domain(["A", "B", "C"]);
      const colorLink = (type) => (type > 0 ? "#00d2ff" : "#ff4d4d"); // Cyan vs Red

      // 툴팁 요소
      const tooltip = d3.select("#tooltip");

      // === 3. 업데이트 함수 (핵심 로직 수정됨) ===
      function updateLayout(criteria) {
        console.log("Updating layout with criteria:", criteria); // 디버깅용 로그

        // 버튼 스타일 업데이트
        document
          .querySelectorAll("button")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById(`btn-${criteria}`).classList.add("active");

        // 1. 데이터 정렬 (Deep Copy하여 원본 보존)
        let sortedNodes = [...data.nodes];
        if (criteria === "id") {
          sortedNodes.sort(
            (a, b) => data.nodes.indexOf(a) - data.nodes.indexOf(b)
          );
        } else if (criteria === "group") {
          sortedNodes.sort(
            (a, b) =>
              d3.ascending(a.group, b.group) || d3.descending(a.rank, b.rank)
          );
        } else if (criteria === "rank") {
          sortedNodes.sort((a, b) => d3.descending(a.rank, b.rank));
        }

        // X축 도메인 업데이트
        x.domain(sortedNodes.map((d) => d.id));

        // 2. 노드 렌더링 (Join 문법 사용 - 가장 안전함)
        const nodes = nodeLayer
          .selectAll(".node")
          .data(sortedNodes, (d) => d.id)
          .join(
            (enter) => {
              const group = enter
                .append("g")
                .attr("class", "node")
                .attr("transform", (d) => `translate(${x(d.id)}, 0)`);

              group
                .append("circle")
                .attr("r", 0) // 애니메이션을 위해 0에서 시작
                .style("fill", (d) => colorGroup(d.group))
                .transition()
                .duration(750)
                .attr("r", 10);

              group
                .append("text")
                .attr("y", 25)
                .text((d) => d.id)
                .style("opacity", 0)
                .transition()
                .duration(750)
                .style("opacity", 1);

              return group;
            },
            (update) =>
              update
                .transition()
                .duration(750)
                .attr("transform", (d) => `translate(${x(d.id)}, 0)`),
            (exit) =>
              exit.transition().duration(500).style("opacity", 0).remove()
          );

        // 3. 링크(아크) 렌더링
        const drawArc = (d) => {
          const start = x(d.source);
          const end = x(d.target);
          if (start === undefined || end === undefined) return "";

          const distance = Math.abs(end - start);
          const arcHeight = distance * 0.6; // 호 높이 비율 조정
          const sweep = d.type > 0 ? 0 : 1; // 0: 위로, 1: 아래로

          return `M ${start},0 A ${distance / 2},${arcHeight} 0 0,${sweep} ${end},0`;
        };

        linkLayer
          .selectAll("path")
          .data(data.links)
          .join(
            (enter) =>
              enter
                .append("path")
                .attr("class", "link")
                .style("stroke", (d) => colorLink(d.type))
                .style("stroke-width", 0)
                .attr("d", drawArc)
                .transition()
                .duration(1000)
                .style("stroke-width", (d) => Math.sqrt(d.value) * 2), // 두께 조정
            (update) =>
              update
                .transition()
                .duration(1000)
                .attr("d", drawArc)
                .style("stroke", (d) => colorLink(d.type)),
            (exit) => exit.remove()
          )
          // 이벤트 리스너 재부착 (update 시 끊길 수 있으므로 join 밖에서 처리하거나 merge 필요하지만 여기선 간단히)
          .on("mouseover", function (event, d) {
            d3.select(this).style("stroke", "#fff").style("stroke-opacity", 1);
            tooltip
              .style("visibility", "visible")
              .html(
                `<strong>${d.source} ↔ ${d.target}</strong><br/>
                       관계: ${d.type > 0 ? "<span style='color:#00d2ff'>우호</span>" : "<span style='color:#ff4d4d'>적대</span>"}<br/>
                       강도: ${d.value}`
              )
              .style("left", event.pageX + 15 + "px")
              .style("top", event.pageY - 15 + "px");
          })
          .on("mouseout", function (event, d) {
            d3.select(this)
              .style("stroke", colorLink(d.type))
              .style("stroke-opacity", 0.5);
            tooltip.style("visibility", "hidden");
          });
      }

      // 초기 실행
      console.log("Script loaded. Initializing chart...");
      updateLayout("id");
    </script>
  </body>
</html>
