<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/main_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>StoLink - 스마트한 스토리 관리 플랫폼</title>
    <meta
      name="description"
      content="복선, 캐릭터, 설정을 한눈에 관리하세요. AI가 도와주는 스마트한 스토리 관리 플랫폼. 무료로 시작하기."
    />
    <meta
      name="keywords"
      content="소설 쓰기, 스토리 관리, 복선 추적, 캐릭터 관계도, AI 집필 도우미, 창작 도구"
    />
    <meta name="author" content="StoLink" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StoLink - 스마트한 스토리 관리 플랫폼" />
    <meta
      property="og:description"
      content="복선, 캐릭터, 설정을 한눈에 관리하세요. AI가 도와주는 스마트한 스토리 관리 플랫폼."
    />
    <meta property="og:image" content="/assets/main_logo.png" />
    <meta property="og:url" content="https://stolink.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#6B8E6B" />

    <!-- Preconnect and DNS-prefetch to external origins for faster loading -->
    <link rel="dns-prefetch" href="api.stolink.com" />

    <!-- Preload critical local fonts for LCP optimization -->
    <link
      rel="preload"
      href="/fonts/Pretendard-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/DMSerifDisplay-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Pretendard-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* CLS 방지: 폰트 로딩 시 텍스트 크기 일관성 유지 */
      /* font-size-adjust로 ascent 비율 맞춤 → 시스템 폰트 → 웹 폰트 전환 시 레이아웃 시프트 최소화 */
      body {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          Roboto,
          "Helvetica Neue",
          "Segoe UI",
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          "Malgun Gothic",
          "Apple Color Emoji",
          "Segoe UI Emoji",
          "Segoe UI Symbol",
          sans-serif;
        /* Pretendard와 시스템 폰트 간 x-height 비율 조정 */
        font-size-adjust: 0.5;
        margin: 0;
        background-color: #ffffff;
      }

      /* 헤딩 폰트도 동일하게 적용 */
      .font-serif,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-size-adjust: 0.52;
      }

      /* SkipLink CLS 방지용 기본 sr-only (Tailwind 로드 전 대응) */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      /* Initial Loading Screen Styles */
      .loader-wrapper {
        position: fixed;
        inset: 0;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .loader-container {
        text-align: center;
      }
      .loader-logo {
        font-size: 2.5rem;
        font-weight: 700;
        color: #6b8e6b;
        margin-bottom: 1rem;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeIn 0.8s ease-out forwards;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .loader-bar {
        width: 120px;
        height: 2px;
        background: #f1f5f9;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
        border-radius: 1px;
      }
      .loader-progress {
        position: absolute;
        width: 40%;
        height: 100%;
        background: #6b8e6b;
        animation: loading 1.5s infinite ease-in-out;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes loading {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader-wrapper">
        <div class="loader-container">
          <div class="loader-logo">StoLink</div>
          <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
